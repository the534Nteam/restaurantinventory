<!doctype html>
<html lang="en">

<title>Pepper Lunch Inventory</title>

<style>

  *{box-sizing:border-box}html,body{margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.4;-webkit-text-size-adjust:100%}

  .start .brand .dot{width:14px;height:14px;border-radius:4px;background:#ffd100}
  .clock{color:var(--muted);font-size:14px;margin-top:14px}.bigdate{font-size:24px;font-weight:800;margin:2px 0}.bigtime{font-size:16px;color:var(--muted)}

  .daybtn{padding:18px;border-radius:14px;border:2px solid var(--line);background:#fff;font-size:20px;font-weight:800;cursor:pointer;transition:.12s}
  .daybtn:hover{border-color:var(--red);color:var(--red);transform:translateY(-1px)}

  .brand .dot{width:11px;height:11px;border-radius:3px;background:#ffd100;box-shadow:0 0 0 3px rgba(255,255,255,.25)}
  .grow{flex:1}

  input.count{width:44px;text-align:center;padding:8px 3px;border:2px solid var(--line);border-radius:8px;font-weight:700;font-size:16px}
  input.count:focus{outline:none;border-color:var(--red)}
  .addbox{display:flex;align-items:center;gap:4px;justify-content:center}

  .addlabels{display:flex;gap:4px;justify-content:center;font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.3px;margin-top:2px}
  .addlabels span{width:44px;text-align:center}
  .have{font-weight:700;white-space:nowrap}.uu{font-size:11px;color:var(--muted);font-weight:600}
  .resetbtn{background:none;border:none;color:var(--muted);cursor:pointer;font-size:14px;padding:2px 4px}
  .order-cell b{font-weight:800;font-size:16px}

  .toolbar{display:flex;gap:8px;flex-wrap:wrap;padding:12px 14px;border-top:1px solid var(--line);background:#fafafa}
  .hint{font-size:12px;color:var(--muted);padding:0 14px 12px}
  .summary{padding:12px 14px}
  .osec{font-weight:800;color:var(--red);font-size:11px;text-transform:uppercase;letter-spacing:.5px;margin:10px 0 2px}
  .summary .line{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px dashed var(--line)}

  .empty{padding:24px;text-align:center;color:var(--muted)}
  .setup-sec{padding:14px}.setup-sec h3{margin:0 0 4px}.setup-sec .sub{color:var(--muted);font-size:13px;margin-bottom:10px}

  .setsec{font-weight:800;color:var(--red);font-size:12px;text-transform:uppercase;letter-spacing:.4px;margin:12px 0 6px;border-bottom:1px solid var(--line);padding-bottom:3px}

  .parwk .d{display:flex;flex-direction:column;align-items:center;gap:3px}.parwk .d span{font-size:11px;font-weight:700;color:var(--red)}

  .itemrow .top input[type=text],.itemrow .top input[type=number]{padding:6px;border:1px solid var(--line);border-radius:6px;width:100%}
  .prot{display:flex;align-items:center;gap:4px;font-size:11px;font-weight:700;color:var(--muted);white-space:nowrap}
  .ctrlline{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:2px 0 6px;font-size:11px;font-weight:700;color:var(--muted)}

  .gate .dot{width:13px;height:13px;border-radius:4px;background:#ffd100}

  .gate input{width:100%;padding:14px;border:2px solid var(--line);border-radius:12px;font-size:20px;font-weight:700;text-align:center;letter-spacing:4px}
  .gate input:focus{outline:none;border-color:var(--red)}

</head>

    <input id="gateInput" type="tel" inputmode="numeric" maxlength="12" placeholder="••••" autocomplete="off">
    <div class="err" id="gateErr"></div>
    <button class="btn" id="gateBtn">Unlock</button>
  </div>
</div>

<div id="startScreen">
  <div class="start">
    <div class="brand"><span class="dot"></span> Pepper Lunch Inventory</div>

</div>

<div id="appScreen" style="display:none">
  <header>
    <div class="hrow">
      <div class="brand"><span class="dot"></span> Pepper Lunch</div>
      <div class="loc" id="locLabel" title="Switch location">📍 Moanalua</div>
      <div class="who" id="whoLabel" style="display:none"></div>
      <div class="grow"></div>
      <div class="synced" id="syncChip" title="Sync status" style="display:none"><span class="dotc"></span><span id="syncTxt">Offline</span></div>
      <div class="daychip" id="daychip" title="Change order day">
        <div><b id="chipDay">—</b> <small id="chipDate"></small></div><span class="edit">change ▸</span>
      </div>
    </div>
    <nav>
      <button data-tab="count" class="active">📋 Count</button>
      <button data-tab="orders">📦 Orders</button>
      <button data-tab="history">🕓 History</button>
      <button data-tab="setup">⚙️ Setup</button>

  </header>
  <main>
    <div id="tab-count"></div>
    <div id="tab-orders" style="display:none"></div>
    <div id="tab-history" style="display:none"></div>
    <div id="tab-setup" style="display:none"></div>
  </main>
</div>

let state,counts,history,ui={tab:'count',day:null};
function load(){ try{ const raw=localStorage.getItem(STORE_KEY); if(raw){ const o=JSON.parse(raw); state=o.config; counts=o.counts||{}; history=o.history||[]; } }catch(e){} if(!state) state=seedConfig(); if(!counts) counts={}; if(!history) history=[];
  if(!state.locations||!state.locations.length) state.locations=[{id:'moanalua',name:'Moanalua'}];
  if(!state.locationId||!state.locations.some(l=>l.id===state.locationId)) state.locationId=state.locations[0].id; }
function save(){ try{ localStorage.setItem(STORE_KEY,JSON.stringify({config:state,counts,history})); }catch(e){} if(SYNC.on&&!SYNC.applying) schedulePush(); }

function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function num(v){ return (v===''||v==null||isNaN(v))?0:Number(v); }
function cell(id){ return counts[id]||(counts[id]={c:'',l:''}); }
function pc(it){ return it.perCase>0?it.perCase:1; }
function totalLoose(it){ const c=cell(it.id); return num(c.c)*pc(it)+num(c.l); }
function onHandParUnit(it){ return it.parUnit==='loose' ? totalLoose(it) : totalLoose(it)/pc(it); }
function orderQty(it,day){ const need=(Number(it.pars[day])||0)-onHandParUnit(it); return need>0?Math.ceil(need):0; }
function parULabel(it){ return it.parUnit==='loose'?(it.unit||'ea'):'cs'; }
function haveText(it,empty){ const c=cell(it.id),a=num(c.c),b=num(c.l); if(!a&&!b) return empty||'—'; const p=[]; if(a)p.push(a+' cs'); if(b)p.push(b+' '+(it.unit||'ea')); return p.join(' / '); }
function methodBadge(m){ return m==='excel'?'<span class="badge b-excel">Excel form</span>':m==='web'?'<span class="badge b-web">Web portal</span>':'<span class="badge b-text">Text / email</span>'; }
function flash(msg){ const f=document.getElementById('flash'); f.textContent=msg; f.classList.add('show'); clearTimeout(f._t); f._t=setTimeout(()=>f.classList.remove('show'),1800); }
function fmtDate(d){ return d.toLocaleDateString(undefined,{weekday:'long',year:'numeric',month:'long',day:'numeric'}); }
function fmtTime(d){ return d.toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'}); }
function findItem(id){ for(const v of state.vendors){ const it=v.items.find(x=>x.id===id); if(it) return {v,it}; } return {}; }
function vendorSections(v){ const order=[],map={}; v.items.forEach(it=>{ const s=it.section||''; if(!(s in map)){ map[s]=[]; order.push(s); } map[s].push(it); }); order.forEach(s=>map[s].sort((a,b)=>a.name.localeCompare(b.name))); return order.map(s=>({name:s,items:map[s]})); }
function toOrderCount(v,day){ let n=0; v.items.forEach(it=>{ if(orderQty(it,day)>0) n++; }); return n; }

function buildTextOrder(v,day){
  let out=`PEPPER LUNCH — ${v.name} order\nOrder day: ${FULL[day]}\n`+(state.userName?`Counted by: ${state.userName}\n`:'')+`\n`,total=0;
  vendorSections(v).forEach(sec=>{ const lines=sec.items.map(it=>({it,q:orderQty(it,day)})).filter(l=>l.q>0); if(!lines.length) return;
    if(sec.name) out+=`— ${sec.name} —\n`;
    lines.forEach(l=>{ const sku=l.it.sku?l.it.sku+'  ':''; out+=`${(l.q+' '+parULabel(l.it)).padStart(8,' ')}  ${sku}${l.it.name}\n`; total++; }); out+='\n'; });
  if(!total) out+='(Nothing to order — all pars met.)\n'; else out+=`Total items: ${total}`;
  return out;
}

function saveSnapshot(){
  const day=ui.day,now=new Date();

  state.vendors.forEach(v=>{
    const items=v.items.map(it=>({name:it.name, sku:it.sku||'', have:haveText(it,'0'), ohUnits:Math.round(onHandParUnit(it)*100)/100, par:it.pars[day]||0, order:orderQty(it,day), unit:parULabel(it)}));

/* XLSX */
const CRC_TABLE=(()=>{ const t=new Uint32Array(256); for(let n=0;n<256;n++){ let c=n; for(let k=0;k<8;k++) c=(c&1)?(0xEDB88320^(c>>>1)):(c>>>1); t[n]=c>>>0; } return t; })();
function crc32(b){ let c=0xFFFFFFFF; for(let i=0;i<b.length;i++) c=CRC_TABLE[(c^b[i])&0xFF]^(c>>>8); return (c^0xFFFFFFFF)>>>0; }
function sB(s){ return new TextEncoder().encode(s); }
function zipStore(files){ const chunks=[],central=[]; let offset=0; const u16=n=>[n&255,(n>>8)&255],u32=n=>[n&255,(n>>8)&255,(n>>16)&255,(n>>24)&255];
  files.forEach(f=>{ const nB=sB(f.name),data=f.bytes,crc=crc32(data);
    const loc=[].concat(u32(0x04034b50),u16(20),u16(0),u16(0),u16(0),u16(0),u32(crc),u32(data.length),u32(data.length),u16(nB.length),u16(0));
    const lh=new Uint8Array(loc.length+nB.length); lh.set(loc,0); lh.set(nB,loc.length); chunks.push(lh,data);
    const cen=[].concat(u32(0x02014b50),u16(20),u16(20),u16(0),u16(0),u16(0),u16(0),u32(crc),u32(data.length),u32(data.length),u16(nB.length),u16(0),u16(0),u16(0),u16(0),u32(0),u32(offset));
    const ch=new Uint8Array(cen.length+nB.length); ch.set(cen,0); ch.set(nB,cen.length); central.push(ch); offset+=lh.length+data.length; });
  let cenSize=0; central.forEach(c=>cenSize+=c.length);
  const end=[].concat(u32(0x06054b50),u16(0),u16(0),u16(files.length),u16(files.length),u32(cenSize),u32(offset),u16(0));
  const parts=[...chunks,...central,new Uint8Array(end)]; let total=0; parts.forEach(p=>total+=p.length);
  const out=new Uint8Array(total); let pos=0; parts.forEach(p=>{ out.set(p,pos); pos+=p.length; }); return out;
}
function colRef(n){ let s=''; n++; while(n>0){ const m=(n-1)%26; s=String.fromCharCode(65+m)+s; n=Math.floor((n-1)/26); } return s; }

function sheetXml(rows){ let body=''; rows.forEach((row,ri)=>{ let cells=''; row.forEach((cl,ci)=>{ const val=(cl&&typeof cl==='object')?cl.v:cl; const st=(cl&&typeof cl==='object')?cl.s:0; cells+=cX(ri+1,ci,val,st); }); body+=`<row r="${ri+1}">${cells}</row>`; });

/* USAGE-BASED PAR SUGGESTIONS (no AI — estimates consumption between saved counts) */
function analyzeSuggestions(){
  const snaps=history.slice().sort((a,b)=>a.ts<b.ts?-1:(a.ts>b.ts?1:0));
  const series={};
  snaps.forEach(s=>s.vendors.forEach(v=>v.items.forEach(it=>{
    const key=v.name+'|'+(it.sku||it.name);
    (series[key]=series[key]||[]).push({oh:Number(it.ohUnits)||0, order:Number(it.order)||0, name:it.name, vendorName:v.name});
  })));
  const out=[];
  Object.keys(series).forEach(key=>{
    const arr=series[key]; if(arr.length<2) return;
    const usages=[];
    for(let i=1;i<arr.length;i++){ const u=(arr[i-1].oh+arr[i-1].order)-arr[i].oh; if(isFinite(u)&&u>=0) usages.push(u); }
    if(!usages.length) return;
    const maxU=Math.max(...usages), avgU=usages.reduce((a,b)=>a+b,0)/usages.length;
    const parts=key.split('|'), vn=parts[0], idkey=parts.slice(1).join('|');
    const v=state.vendors.find(x=>x.name===vn); if(!v) return;
    const it=v.items.find(x=>(x.sku||x.name)===idkey); if(!it) return;
    const suggested=Math.max(0,Math.round(maxU*1.1*100)/100);
    out.push({itemId:it.id, vendorName:v.name, name:it.name, unit:parULabel(it), currentPar:it.pars.tue||0, cycles:usages.length, avgU:Math.round(avgU*10)/10, maxU:Math.round(maxU*10)/10, suggested});
  });
  return out.sort((a,b)=>a.vendorName.localeCompare(b.vendorName)||a.name.localeCompare(b.name));
}
function applySug(itemId,val){ const it=findItem(itemId).it; if(!it) return; ORDER_DAYS.forEach(d=>it.pars[d]=val); }
function showSuggestions(){
  const box=document.getElementById('suggBox'); const list=analyzeSuggestions();
  if(!list.length){ box.innerHTML='<div class="empty" style="padding:14px">Not enough data yet. Save at least <b>2 inventories</b> on different days — the app will estimate how much you use between counts and suggest par levels.</div>'; return; }
  const rows=list.map(s=>{ const changed=Math.abs(s.suggested-s.currentPar)>0.001;
    return `<tr><td>${esc(s.name)}<div class="sku">${esc(s.vendorName)} · ${s.cycles} cycle${s.cycles>1?'s':''}</div></td>
    <td class="num">${s.currentPar} ${esc(s.unit)}</td><td class="num">${s.avgU}</td><td class="num">${s.maxU}</td>
    <td class="num"><b style="color:${changed?'var(--red)':'var(--muted)'}">${s.suggested} ${esc(s.unit)}</b></td>
    <td class="num"><button class="btn sm ${changed?'':'ghost'}" data-applysug="${s.itemId}|${s.suggested}">Apply</button></td></tr>`; }).join('');
  box.innerHTML=`<div class="hint" style="padding:6px 0 10px">Suggested par = peak usage seen between counts + 10% buffer, from ${history.length} saved inventories. Applying overwrites all 3 order days — review first.</div>
    <div style="overflow-x:auto"><table><thead><tr><th>Item</th><th class="num">Current par</th><th class="num">Avg use</th><th class="num">Peak use</th><th class="num">Suggested</th><th class="num"></th></tr></thead><tbody>${rows}</tbody></table></div>
    <div class="row" style="margin-top:12px"><button class="btn" id="applyAllSug">Apply all suggestions</button><span class="hint" style="padding:0">Then fine-tune per day in ⚙️ Setup.</span></div>`;
  box.querySelectorAll('[data-applysug]').forEach(b=>b.addEventListener('click',()=>{ const [iid,val]=b.dataset.applysug.split('|'); applySug(iid,Number(val)); save(); flash('Par updated'); showSuggestions(); }));
  document.getElementById('applyAllSug').addEventListener('click',()=>{ list.forEach(s=>applySug(s.itemId,s.suggested)); save(); flash('Applied '+list.length+' par suggestions'); showSuggestions(); });

    html+=`<div class="card"><div class="vhead" data-htoggle="${idx}" style="cursor:pointer">
        <div><h2 style="font-size:15px">${esc(s.dateStr)}</h2><div class="meta">${esc(FULL[s.day]||s.day)} · ${esc(s.timeStr||'')}${s.name?' · 👤 '+esc(s.name):''} · <b style="color:var(--red)">${totOrder} to order</b></div></div>
        <button class="btn sm ghost" data-hdel="${idx}" style="margin-left:auto">Delete</button><span class="chev">▾</span></div>
      <div class="hbody" style="display:none;padding:12px 14px">${body||'<div class="empty">Nothing recorded.</div>'}</div></div>`;
  });
  host.innerHTML=html;
  document.getElementById('genSug').addEventListener('click',showSuggestions);
  host.querySelectorAll('[data-htoggle]').forEach(h=>h.addEventListener('click',e=>{ if(e.target.closest('[data-hdel]')) return; const b=h.parentElement.querySelector('.hbody'); const open=b.style.display!=='none'; b.style.display=open?'none':''; h.querySelector('.chev').style.transform=open?'rotate(-90deg)':''; }));
  host.querySelectorAll('[data-hdel]').forEach(b=>b.addEventListener('click',()=>{ if(confirm('Delete this saved inventory?')){ history.splice(Number(b.dataset.hdel),1); save(); renderHistory(); }}));
}

function switchTab(t){ ui.tab=t; document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===t)); ['count','orders','history','setup'].forEach(x=>document.getElementById('tab-'+x).style.display=x===t?'':'none'); if(t==='count') renderCount(); else if(t==='orders') renderOrders(); else if(t==='history') renderHistory(); else renderSetup(); }

/* ============================================================ CLOUD SYNC ENGINE ============================================================ */
let pushTimer=null;
function schedulePush(){ if(!SYNC.on) return; clearTimeout(pushTimer); pushTimer=setTimeout(pushConfig,600); }
function syncErr(){ setSyncChip('err'); }
function setSyncChip(s){ const c=document.getElementById('syncChip'),t=document.getElementById('syncTxt'); if(!c) return; c.style.display=syncEnabled()?'':'none'; c.classList.remove('on','err'); if(s==='on'){ c.classList.add('on'); t.textContent='Synced'; } else if(s==='err'){ c.classList.add('err'); t.textContent='Sync error'; } else t.textContent='Connecting…'; }
function pushConfig(){ if(!SYNC.on||!SYNC.storeRef) return;
  SYNC.storeRef.set({vendors:state.vendors, recipientsGlobal:state.recipientsGlobal||'', history:history},{merge:true}).catch(syncErr);
  if(SYNC.indexRef) SYNC.indexRef.set({locations:state.locations},{merge:true}).catch(()=>{}); }
function pushCount(id){ if(!SYNC.on||!SYNC.storeRef) return; const o={}; o['counts.'+id]=cell(id); SYNC.storeRef.update(o).catch(()=>SYNC.storeRef.set({counts:{[id]:cell(id)}},{merge:true}).catch(syncErr)); }
function pushCountsClear(){ if(!SYNC.on||!SYNC.storeRef) return; SYNC.storeRef.update({counts:{}}).catch(syncErr); }
function isTypingIn(tabId){ const a=document.activeElement; const host=document.getElementById(tabId); return a&&host&&host.contains(a)&&/^(INPUT|SELECT|TEXTAREA)$/.test(a.tagName); }
function applyRemoteStore(data, own){ if(!data) return; SYNC.applying=true;
  if(Array.isArray(data.vendors)) state.vendors=data.vendors;
  if(typeof data.recipientsGlobal==='string') state.recipientsGlobal=data.recipientsGlobal;
  if(Array.isArray(data.history)) history=data.history;
  if(data.counts&&typeof data.counts==='object') counts=data.counts;
  try{ localStorage.setItem(STORE_KEY,JSON.stringify({config:state,counts,history})); }catch(e){}
  SYNC.applying=false;
  if(document.getElementById('appScreen').style.display==='none') return;
  // refresh UI. Count-tab uses in-place total refresh so a live update never clears
  // the boxes someone is typing into. Setup skips re-render while a field is focused.
  if(ui.tab==='count'){ try{ refreshAllTotals(); }catch(e){ renderCount(); } }
  else if(ui.tab==='orders') renderOrders();
  else if(ui.tab==='history') renderHistory();
  else if(ui.tab==='setup'){ if(!(own||isTypingIn('tab-setup'))) renderSetup(); } }
function applyRemoteIndex(data){ if(!data) return;
  if(Array.isArray(data.locations)&&data.locations.length){ state.locations=data.locations; if(!state.locations.some(l=>l.id===state.locationId)) state.locationId=state.locations[0].id; }
  SYNC.passcode=(data.passcode!=null?String(data.passcode):'');
  if(needGate()&&document.getElementById('gateScreen').style.display==='none'&&document.getElementById('appScreen').style.display==='none') showGate(); }
function refreshAllTotals(){ const host=document.getElementById('tab-count'); if(!host) return; let ok=true;
  state.vendors.forEach(v=>v.items.forEach(it=>{ const h=host.querySelector('[data-have="'+it.id+'"]'); if(!h){ ok=false; return; } h.textContent=haveText(it);
    const oc=host.querySelector('[data-order="'+it.id+'"]'); if(oc){ const q=orderQty(it,ui.day); oc.querySelector('b').textContent=q; oc.classList.toggle('zero',q<=0); oc.closest('tr').classList.toggle('toorder',q>0); } }));
  if(!ok){ renderCount(); return; }
  state.vendors.forEach(v=>{ const m=host.querySelector('[data-meta="'+v.id+'"]'); if(m){ const n=toOrderCount(v,ui.day); m.innerHTML=`${v.items.length} items${n?' · <b style="color:var(--red)">'+n+' to order</b>':''}`; } }); }
function locDocId(){ return 'loc_'+(state.locationId||'default'); }
let resubTimer=null;
function scheduleResub(){ if(!SYNC.on) return; clearTimeout(resubTimer); resubTimer=setTimeout(()=>{ if(SYNC.on) subscribeLocation(); }, 4000); }
function subscribeLocation(){ if(!SYNC.on) return;
  SYNC.unsub.forEach(u=>{try{u();}catch(e){}}); SYNC.unsub=[];
  if(SYNC.indexRef){ const ui2=SYNC.indexRef.onSnapshot(s=>{ if(s.exists) applyRemoteIndex(s.data()); },()=>{}); SYNC.unsub.push(ui2); }
  SYNC.storeRef=SYNC.db.collection('stores').doc(locDocId());
  const u1=SYNC.storeRef.onSnapshot(snap=>{ setSyncChip('on'); if(snap.exists) applyRemoteStore(snap.data(), snap.metadata.hasPendingWrites); else if(!snap.metadata.hasPendingWrites) pushConfig(); }, err=>{ setSyncChip('err'); scheduleResub(); });
  SYNC.unsub.push(u1); }
function initSync(){ if(!syncEnabled()) return false;
  try{ firebase.initializeApp(FIREBASE_CONFIG); SYNC.db=firebase.firestore(); SYNC.db.enablePersistence({synchronizeTabs:true}).catch(()=>{});
    SYNC.on=true; SYNC.indexRef=SYNC.db.collection('stores').doc('_index'); setSyncChip('connecting'); return true;
  }catch(e){ SYNC.on=false; return false; } }
/* passcode gate */
const PASS_KEY='pepperlunch_passok';
function needGate(){ return SYNC.on && SYNC.passcode && localStorage.getItem(PASS_KEY)!==SYNC.passcode; }
function showGate(){ document.getElementById('gateScreen').style.display=''; document.getElementById('startScreen').style.display='none'; document.getElementById('appScreen').style.display='none'; const inp=document.getElementById('gateInput'); inp.value=''; setTimeout(()=>inp.focus(),120); }
function tryUnlock(){ const inp=document.getElementById('gateInput'),err=document.getElementById('gateErr');
  if(String(inp.value)===String(SYNC.passcode)&&SYNC.passcode){ try{ localStorage.setItem(PASS_KEY,SYNC.passcode); }catch(e){} document.getElementById('gateScreen').style.display='none'; showStart(); }
  else { err.textContent='Incorrect passcode'; inp.value=''; inp.focus(); } }

/* ---------- boot ---------- */
load(); startClock();
if(initSync()){ subscribeLocation(); setTimeout(()=>{ if(needGate()) showGate(); else if(document.getElementById('appScreen').style.display==='none') showStart(); }, 900); }
else showStart();
document.getElementById('goSetup').addEventListener('click',()=>{ if(!ui.day) ui.day=ORDER_DAYS[0]; enterApp(ui.day); switchTab('setup'); });
document.getElementById('daychip').addEventListener('click',showStart);
document.getElementById('locLabel').addEventListener('click',showStart);
document.getElementById('gateBtn').addEventListener('click',tryUnlock);
document.getElementById('gateInput').addEventListener('keydown',e=>{ if(e.key==='Enter') tryUnlock(); });
document.querySelectorAll('nav button').forEach(b=>b.addEventListener('click',()=>switchTab(b.dataset.tab)));
</script>
</body>
