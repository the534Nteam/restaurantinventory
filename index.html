<style>
  /* Layout: sticky red header + tabbed cards; brand red and Pepper Lunch yellow on warm neutrals */
  :root{--red:#c8102e;--red-dark:#9c0c23;--ink:#1c1c1e;--muted:#6b6468;--line:#e6e1e3;--bg:#f5f3f4;--card:#fff;--sub:#faf8f9;--sect:#fbe9ec;--order:#fff4f5;--btn2:#e7e3e5;--btn2-ink:#374151;--danger:#991b1b;--danger-bg:#fee2e2;--ok:#166534;--ok-bg:#dcfce7;--shadow:0 1px 3px rgba(0,0,0,.08);color-scheme:light}

  *{box-sizing:border-box}html,body{margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.4;-webkit-text-size-adjust:100%}
  #startScreen{min-height:100vh;display:flex;align-items:flex-start;justify-content:center;background:linear-gradient(160deg,#c8102e,#7d0b1d);padding:8vh 16px}

  .namefield input,.namefield select{width:100%;padding:12px;border:2px solid var(--line);border-radius:12px;font-size:16px;font-weight:600;background:var(--card);color:var(--ink)}
  .namefield input:focus,.namefield select:focus{outline:none;border-color:var(--red)}
  .who{display:flex;align-items:center;gap:5px;font-size:13px;font-weight:700;color:#fff;background:rgba(255,255,255,.16);padding:5px 10px;border-radius:9px}

  .loc:hover{background:#ffdb33}

  .daybtn:hover{border-color:var(--red);color:var(--red);transform:translateY(-1px)}

  tr.sectionrow td{background:var(--sect);color:var(--red);font-weight:800;font-size:11px;text-transform:uppercase;letter-spacing:.5px;padding:6px 10px}
  input.count{width:44px;text-align:center;padding:8px 3px;border:2px solid var(--line);border-radius:8px;font-weight:700;font-size:16px}

  .addbox{display:flex;align-items:center;gap:4px;justify-content:center}

  .btn{background:var(--red);color:#fff;border:none;padding:9px 14px;border-radius:8px;font-weight:700;cursor:pointer}
  .btn:hover{background:var(--red-dark)}.btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line)}.btn.ghost:hover{background:var(--sub)}

  .summary{padding:12px 14px}

  .summary .line:last-child{border-bottom:none}.summary .qty{font-weight:800;color:var(--red);white-space:nowrap}.summary .oh{font-size:11px;color:var(--muted)}
  .empty{padding:24px;text-align:center;color:var(--muted)}

  .setsec{font-weight:800;color:var(--red);font-size:12px;text-transform:uppercase;letter-spacing:.4px;margin:12px 0 6px;border-bottom:1px solid var(--line);padding-bottom:3px}
  .parwk{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:320px}
  .parwk .d{display:flex;flex-direction:column;align-items:center;gap:3px}.parwk .d span{font-size:11px;font-weight:700;color:var(--red)}
  .parwk .d input{width:100%;text-align:center;padding:6px;border:1px solid var(--line);border-radius:6px}
  .itemrow{border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:8px;background:var(--card)}
  .itemrow .top{display:grid;grid-template-columns:80px 1fr 90px 60px auto 30px;gap:6px;margin-bottom:6px;align-items:center}
  .itemrow .top input[type=text],.itemrow .top input[type=number]{padding:6px;border:1px solid var(--line);border-radius:6px;width:100%}
  .prot{display:flex;align-items:center;gap:4px;font-size:11px;font-weight:700;color:var(--muted);white-space:nowrap}
  .ctrlline{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:2px 0 6px;font-size:11px;font-weight:700;color:var(--muted)}
  .ctrlline input,.ctrlline select{padding:5px 6px;border:1px solid var(--line);border-radius:6px}
  .ctrlline input.sec{width:180px}.ctrlline input.un{width:90px}
  .x{background:var(--danger-bg);color:var(--danger);border:none;border-radius:6px;cursor:pointer;font-weight:800;height:30px}
  .parlabel{font-size:11px;font-weight:700;color:var(--muted);margin:2px 0}
  details.vedit{border:1px solid var(--line);border-radius:10px;margin-bottom:12px;background:var(--card)}

  details.vedit>summary::-webkit-details-marker{display:none}.vedit .inner{padding:0 12px 12px}
  .flash{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:#111827;color:#fff;padding:10px 16px;border-radius:10px;font-weight:600;box-shadow:0 6px 20px rgba(0,0,0,.3);z-index:50;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none}
  .flash.show{opacity:1;transform:translateX(-50%) translateY(-4px)}
  @media(max-width:640px){th.hide-m,td.hide-m{display:none}.itemrow .top{grid-template-columns:1fr 1fr}main{padding:10px}}
  /* sync + passcode */
  .synced{display:flex;align-items:center;gap:5px;font-size:12px;font-weight:700;color:#fff;background:rgba(255,255,255,.16);padding:5px 9px;border-radius:9px}
  .synced .dotc{width:8px;height:8px;border-radius:50%;background:#9ca3af}
  .synced.on .dotc{background:#22c55e;box-shadow:0 0 0 3px rgba(34,197,94,.25)}
  .synced.err .dotc{background:#f59e0b}
  #gateScreen{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(160deg,#c8102e,#7d0b1d);padding:8vh 16px}
  .gate{max-width:360px;width:100%;background:var(--card);border-radius:18px;padding:28px 24px;box-shadow:0 12px 40px rgba(0,0,0,.25);text-align:center}
  .gate .brand{font-weight:800;font-size:20px;color:var(--red);display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:6px}
  .gate .dot{width:13px;height:13px;border-radius:4px;background:#ffd100}
  .gate p{color:var(--muted);font-size:14px;margin:6px 0 16px}
  .gate input{width:100%;padding:14px;border:2px solid var(--line);border-radius:12px;font-size:20px;font-weight:700;text-align:center;letter-spacing:4px}
  .gate input:focus{outline:none;border-color:var(--red)}
  .gate .err{color:var(--red);font-size:13px;font-weight:600;min-height:18px;margin-top:8px}
  .gate button{margin-top:12px;width:100%}
  input,select,textarea{background:var(--card);color:var(--ink);font:inherit}
  .field input,.field select,.field textarea,input.count,.gate input{background:var(--card);color:var(--ink)}
  :focus-visible{outline:2px solid var(--red);outline-offset:2px}
  /* auto par + sales */
  .autotag{display:inline-block;font-size:9px;font-weight:800;letter-spacing:.4px;text-transform:uppercase;color:var(--ok);background:var(--ok-bg);border-radius:4px;padding:1px 4px;margin-left:3px;vertical-align:1px}
  .vnote{font-size:13px;background:var(--sub);border-bottom:1px solid var(--line);padding:8px 14px}
  .stat{display:flex;gap:18px;flex-wrap:wrap;margin:6px 0 10px}.stat div{min-width:110px}
  .stat b{display:block;font-size:20px;font-variant-numeric:tabular-nums}.stat span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;font-weight:700}
  .salesgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px;margin-top:8px}
  .salesgrid .s{display:flex;justify-content:space-between;align-items:center;gap:6px;border:1px solid var(--line);border-radius:8px;padding:6px 8px;font-size:13px;font-variant-numeric:tabular-nums}
  .salesgrid .s button{background:none;border:none;color:var(--muted);cursor:pointer;font-size:13px}
  textarea.paste{width:100%;min-height:80px;padding:8px;border:1px solid var(--line);border-radius:8px;font-family:ui-monospace,Menlo,monospace;font-size:13px}
  .src{font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.3px}
  td.num{font-variant-numeric:tabular-nums}
  .usetbl td:first-child{min-width:170px}
  /* in-page confirm (artifact viewers block confirm()) */
  #askBox{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:60;padding:16px}
  #askBox .dlg{background:var(--card);color:var(--ink);border-radius:14px;padding:20px;max-width:360px;width:100%;box-shadow:0 12px 40px rgba(0,0,0,.35)}
  #askBox .dlg p{margin:0 0 16px;font-weight:600}
  #askBox .row{justify-content:flex-end}
  @media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>

<script>
const WEEK=['sun','mon','tue','wed','thu','fri','sat'];
const FULL={sun:'Sunday',mon:'Monday',tue:'Tuesday',wed:'Wednesday',thu:'Thursday',fri:'Friday',sat:'Saturday'};
const ORDER_DAYS=['tue','thu','fri'];
const STORE_KEY='pepperlunch_inventory_v5';
const IN_ARTIFACT=false; /* set to true by build-artifact.sh for the claude.ai copy */
const DEFAULT_STAFF=['Joy','Liam','Levi','Nari','Sean'];
const DEFAULT_COVER_DAYS=5;

/* ============================================================
   CLOUD SYNC (Firebase Firestore) — optional.
   Paste your Firebase project's web config below. Leave apiKey
   empty to run fully offline (localStorage only).
   ============================================================ */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyBYg1P7o7fv-yOiGOHPo9LL5JusfsW9Kk4",
  authDomain: "pepper-lunch-inventory.firebaseapp.com",
  projectId: "pepper-lunch-inventory",
  storageBucket: "pepper-lunch-inventory.firebasestorage.app",
  messagingSenderId: "50685384814",
  appId: "1:50685384814:web:ab9fcc66c22317b1e22e7f"
};
let SYNC = { on:false, db:null, uid:null, secure:false, storeRef:null, histRef:null, indexRef:null, unsub:[], applying:false, passcode:'', last:{} };
function syncEnabled(){ return typeof firebase!=='undefined' && FIREBASE_CONFIG.apiKey; }

/* Random ids so two devices adding items at the same moment can't collide. */
function uid(){ if(window.crypto&&crypto.randomUUID) return 'x'+crypto.randomUUID().replace(/-/g,'').slice(0,16);
  return 'x'+Date.now().toString(36)+Math.random().toString(36).slice(2,10); }
function parsePerCase(pkg){ const m=String(pkg||'').match(/^\s*(\d+)\s*\//); return m?Number(m[1]):1; }
function allDays(v){ const p={}; ORDER_DAYS.forEach(d=>p[d]=(v||0)); return p; }
/* mk(sku,name,pkg,par,opts) — opts:{protein,loose,unit,pc,brand} */
function mk(sku,name,pkg,par,opts){ opts=opts||{};
  return {id:uid(),sku:sku||'',name,pkg:pkg||'',perCase:opts.pc||parsePerCase(pkg),
    protein:!!opts.protein, section:'', parUnit:opts.loose?'loose':'case',
    unit:opts.unit||(opts.protein?'bag':'pack'), brand:opts.brand||'', pars:allDays(par)}; }
function sect(name,arr){ arr.forEach(i=>i.section=name); return arr; }

function seedConfig(){
  return { recipientsGlobal:'', staff:DEFAULT_STAFF.slice(), autoPar:true, coverDays:DEFAULT_COVER_DAYS,
    locations:[{id:'moanalua',name:'Moanalua'}], locationId:'moanalua',
    vendors:[
      { id:uid(), name:'Wismettac', method:'web', recipients:'',
        note:'Enter these quantities into the vendor web portal (Add to Cart).',

/* counts / history / sales belong to the current location; byLoc parks the other locations' copies
   so offline use keeps each store separate (with cloud sync, each location has its own document). */
let state,counts,history,sales={},byLoc={},ui={tab:'count',day:null};
function load(){ let o=null; try{ const raw=localStorage.getItem(STORE_KEY); if(raw) o=JSON.parse(raw); }catch(e){}
  if(o&&o.config){ state=o.config; counts=o.counts||{}; history=o.history||[]; sales=o.sales||{}; byLoc=o.byLoc||{}; }
  if(!state) state=seedConfig(); if(!counts) counts={}; if(!history) history=[];
  if(!state.locations||!state.locations.length) state.locations=[{id:'moanalua',name:'Moanalua'}];
  if(!state.locationId||!state.locations.some(l=>l.id===state.locationId)) state.locationId=state.locations[0].id;
  migrate(); }
function migrate(){
  if(!Array.isArray(state.staff)||!state.staff.length) state.staff=DEFAULT_STAFF.slice();
  if(typeof state.autoPar!=='boolean') state.autoPar=true;
  if(!(Number(state.coverDays)>0)) state.coverDays=DEFAULT_COVER_DAYS;
  (state.vendors||[]).forEach(v=>{ if(v.customerNo===undefined&&v.method==='excel'&&/hata/i.test(v.name||'')){ v.customerNo='847089'; v.sheetNote='Submit by 12 noon the day before delivery (routed Tue & Fri). Qty is in CASE or EACH.'; } });
  (history||[]).forEach(snapId); invalidateModel(); }
function snapId(s){ if(s&&!s.id) s.id='h'+String(s.ts||Date.now()).replace(/\D/g,''); return s; }
function persistLocal(){ try{ localStorage.setItem(STORE_KEY,JSON.stringify({config:state,counts,history,sales,byLoc})); }catch(e){} }
function save(){ invalidateModel(); persistLocal(); if(SYNC.on&&!SYNC.applying) schedulePush(); }
function switchLocation(newId){ if(!newId||newId===state.locationId) return;
  if(SYNC.ready){ clearTimeout(pushTimer); pushConfig(); }
  byLoc[state.locationId]={counts,history,sales};
  const d=byLoc[newId]||{}; counts=d.counts||{}; history=d.history||[]; sales=d.sales||{}; delete byLoc[newId];
  state.locationId=newId; invalidateModel(); if(SYNC.ready) subscribeLocation(); }

/* In-page confirm: the claude.ai viewer blocks window.confirm(), so ask inside the page. */
function askConfirm(msg,yesLabel,onYes){ const box=document.getElementById('askBox');
  document.getElementById('askMsg').textContent=msg; const yes=document.getElementById('askYes'),no=document.getElementById('askNo');
  yes.textContent=yesLabel||'Yes'; box.style.display='';
  const close=()=>{ box.style.display='none'; yes.onclick=null; no.onclick=null; };
  yes.onclick=()=>{ close(); onYes(); }; no.onclick=close; setTimeout(()=>no.focus(),30); }
/* File saves: a plain download link on the hosted site; the downloads capability inside claude.ai. */
async function saveFile(filename,blob){
  if(IN_ARTIFACT){ const dl=window.claude&&window.claude.use?await window.claude.use('downloads'):null;
    if(!dl){ flash('Saving files is not available in this view'); return false; }
    try{ await dl.save({filename,data:blob}); flash('Saved '+filename); return true; }
    catch(e){ if(e&&e.code!=='declined') flash('Could not save the file ('+(e.code||'error')+')'); return false; } }
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=filename; document.body.appendChild(a); a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1000); flash('Downloaded '+filename); return true; }

/* ============================================================
   USAGE + DAYS OF COVER
   Usage between two saved inventories = (earlier on hand + earlier order) − later on hand,
   divided by the days between them. With daily sales entered, usage is also tied to sales
   dollars, so a busy week ahead (forecast from the same weekdays recently) raises the target.
   Target on hand = usage over the next N cover days (default 5). Items without enough
   history fall back to their manual par.
   ============================================================ */
const DAY_MS=864e5;
let _model=null,_fc={};
function invalidateModel(){ _model=null; _fc={}; }
function dateKey(d){ const p=n=>String(n).padStart(2,'0'); return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate()); }
function parseKey(k){ const a=String(k).split('-').map(Number); return new Date(a[0],a[1]-1,a[2]); }
function dayStart(d){ return new Date(d.getFullYear(),d.getMonth(),d.getDate()); }
function salesOn(k){ const v=sales[k]; return (v==null||v===''||isNaN(v))?null:Number(v); }
function salesBetween(a,b){ const d=dayStart(a),end=dayStart(b); let sum=0,n=0;
  while(d<end){ const v=salesOn(dateKey(d)); if(v==null) return null; sum+=v; n++; d.setDate(d.getDate()+1); }
  return n?sum:null; }
function salesForecast(n){ if(_fc[n]!==undefined) return _fc[n];
  const keys=Object.keys(sales).filter(k=>salesOn(k)!=null).sort(); if(!keys.length) return _fc[n]=null;
  const today=dayStart(new Date()),cutoff=new Date(today); cutoff.setDate(cutoff.getDate()-56);
  const recent=keys.filter(k=>parseKey(k)>=cutoff),pool=recent.length?recent:keys.slice(-28);
  const byDow={}; pool.forEach(k=>{ const w=parseKey(k).getDay(); (byDow[w]=byDow[w]||[]).push(salesOn(k)); });
  const avg=a=>a.reduce((x,y)=>x+y,0)/a.length, avgAll=avg(pool.map(salesOn));
  let total=0; for(let i=0;i<n;i++){ const d=new Date(today); d.setDate(d.getDate()+i); const arr=byDow[d.getDay()]; total+=arr?avg(arr):avgAll; }
  return _fc[n]={total,avgDaily:avgAll,daysOfData:pool.length}; }
function usageModel(){ if(_model) return _model;
  const keyToId={}; state.vendors.forEach(v=>v.items.forEach(it=>{ keyToId['i:'+it.id]=it.id; keyToId['n:'+v.name+'|'+(it.sku||it.name)]=it.id; }));
  const snaps=history.filter(s=>s&&s.ts).slice().sort((a,b)=>a.ts<b.ts?-1:(a.ts>b.ts?1:0)),series={};
  snaps.forEach(s=>{ const t=new Date(s.ts); (s.vendors||[]).forEach(v=>(v.items||[]).forEach(it=>{
    const id=(it.itemId&&keyToId['i:'+it.itemId])||keyToId['n:'+v.name+'|'+(it.sku||it.name)]; if(!id) return;
    (series[id]=series[id]||[]).push({t,oh:Number(it.ohUnits)||0,order:Number(it.order)||0}); })); });
  const m={};
  Object.keys(series).forEach(id=>{ const arr=series[id]; let used=0,days=0,usedS=0,salesS=0,cycles=0,peak=0;
    for(let i=1;i<arr.length;i++){ const a=arr[i-1],b=arr[i],d=(b.t-a.t)/DAY_MS; if(d<0.5||d>14) continue;
      const u=a.oh+a.order-b.oh; if(!isFinite(u)||u<0) continue;
      used+=u; days+=d; cycles++; peak=Math.max(peak,u/d);
      const sv=salesBetween(a.t,b.t); if(sv&&sv>0){ usedS+=u; salesS+=sv; } }
    if(!cycles||days<2) return;
    m[id]={perDay:used/days,peakPerDay:peak,perDollar:salesS>0?usedS/salesS:null,cycles,days:Math.round(days*10)/10}; });
  return _model=m; }
function coverDays(){ return Number(state.coverDays)||DEFAULT_COVER_DAYS; }
function coverTarget(it){ if(!state.autoPar) return null; const mm=usageModel()[it.id]; if(!mm) return null;
  const n=coverDays(),fc=mm.perDollar!=null?salesForecast(n):null;
  const need=(fc&&fc.total>0)?mm.perDollar*fc.total:mm.perDay*n;
  return {target:Math.round(need*100)/100,src:(fc&&fc.total>0)?'sales':'counts',perDay:(fc&&fc.total>0)?need/n:mm.perDay}; }
function effPar(it,day){ const c=coverTarget(it); return c?c.target:(Number(it.pars[day])||0); }
function fmtN(n){ return String(Math.round((Number(n)||0)*100)/100); }
function money(n){ return '$'+Math.round(n).toLocaleString(); }

function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function num(v){ return (v===''||v==null||isNaN(v))?0:Number(v); }
function cell(id){ return counts[id]||(counts[id]={c:'',l:''}); }
function pc(it){ return it.perCase>0?it.perCase:1; }
function totalLoose(it){ const c=cell(it.id); return num(c.c)*pc(it)+num(c.l); }
function onHandParUnit(it){ return it.parUnit==='loose' ? totalLoose(it) : totalLoose(it)/pc(it); }
function orderQty(it,day){ const need=effPar(it,day)-onHandParUnit(it); return need>1e-9?Math.ceil(need-1e-9):0; }
function parULabel(it){ return it.parUnit==='loose'?(it.unit||'ea'):'cs'; }
function haveText(it,empty){ const c=cell(it.id),a=num(c.c),b=num(c.l); if(!a&&!b) return empty||'—'; const p=[]; if(a)p.push(a+' cs'); if(b)p.push(b+' '+(it.unit||'ea')); return p.join(' / '); }
function methodBadge(m){ return m==='excel'?'<span class="badge b-excel">Excel form</span>':m==='web'?'<span class="badge b-web">Web portal</span>':'<span class="badge b-text">Text / email</span>'; }
function flash(msg){ const f=document.getElementById('flash'); f.textContent=msg; f.classList.add('show'); clearTimeout(f._t); f._t=setTimeout(()=>f.classList.remove('show'),1800); }
function fmtDate(d){ return d.toLocaleDateString(undefined,{weekday:'long',year:'numeric',month:'long',day:'numeric'}); }
function fmtTime(d){ return d.toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'}); }
function findItem(id){ for(const v of state.vendors){ const it=v.items.find(x=>x.id===id); if(it) return {v,it}; } return {}; }
function vendorSections(v){ const order=[],map={}; v.items.forEach(it=>{ const s=it.section||''; if(!(s in map)){ map[s]=[]; order.push(s); } map[s].push(it); }); order.forEach(s=>map[s].sort((a,b)=>a.name.localeCompare(b.name))); return order.map(s=>({name:s,items:map[s]})); }
function toOrderCount(v,day){ let n=0; v.items.forEach(it=>{ if(orderQty(it,day)>0) n++; }); return n; }

function buildTextOrder(v,day){
  let out=`PEPPER LUNCH — ${v.name} order\nOrder day: ${FULL[day]}\n`+(state.userName?`Counted by: ${state.userName}\n`:'')+`\n`,total=0;
  vendorSections(v).forEach(sec=>{ const lines=sec.items.map(it=>({it,q:orderQty(it,day)})).filter(l=>l.q>0); if(!lines.length) return;
    if(sec.name) out+=`— ${sec.name} —\n`;
    lines.forEach(l=>{ const sku=l.it.sku?l.it.sku+'  ':''; out+=`${(l.q+' '+parULabel(l.it)).padStart(8,' ')}  ${sku}${l.it.name}\n`; total++; }); out+='\n'; });
  if(!total) out+='(Nothing to order — all pars met.)\n'; else out+=`Total items: ${total}`;

/* XLSX */
const CRC_TABLE=(()=>{ const t=new Uint32Array(256); for(let n=0;n<256;n++){ let c=n; for(let k=0;k<8;k++) c=(c&1)?(0xEDB88320^(c>>>1)):(c>>>1); t[n]=c>>>0; } return t; })();
function crc32(b){ let c=0xFFFFFFFF; for(let i=0;i<b.length;i++) c=CRC_TABLE[(c^b[i])&0xFF]^(c>>>8); return (c^0xFFFFFFFF)>>>0; }
function sB(s){ return new TextEncoder().encode(s); }
function zipStore(files){ const chunks=[],central=[]; let offset=0; const u16=n=>[n&255,(n>>8)&255],u32=n=>[n&255,(n>>8)&255,(n>>16)&255,(n>>24)&255];
  files.forEach(f=>{ const nB=sB(f.name),data=f.bytes,crc=crc32(data);
    const loc=[].concat(u32(0x04034b50),u16(20),u16(0),u16(0),u16(0),u16(0),u32(crc),u32(data.length),u32(data.length),u16(nB.length),u16(0));
    const lh=new Uint8Array(loc.length+nB.length); lh.set(loc,0); lh.set(nB,loc.length); chunks.push(lh,data);
    const cen=[].concat(u32(0x02014b50),u16(20),u16(20),u16(0),u16(0),u16(0),u16(0),u32(crc),u32(data.length),u32(data.length),u16(nB.length),u16(0),u16(0),u16(0),u16(0),u32(0),u32(offset));
    const ch=new Uint8Array(cen.length+nB.length); ch.set(cen,0); ch.set(nB,cen.length); central.push(ch); offset+=lh.length+data.length; });
  let cenSize=0; central.forEach(c=>cenSize+=c.length);
  const end=[].concat(u32(0x06054b50),u16(0),u16(0),u16(files.length),u16(files.length),u32(cenSize),u32(offset),u16(0));
  const parts=[...chunks,...central,new Uint8Array(end)]; let total=0; parts.forEach(p=>total+=p.length);
  const out=new Uint8Array(total); let pos=0; parts.forEach(p=>{ out.set(p,pos); pos+=p.length; }); return out;
}
function colRef(n){ let s=''; n++; while(n>0){ const m=(n-1)%26; s=String.fromCharCode(65+m)+s; n=Math.floor((n-1)/26); } return s; }
function cX(r,c,val,style){ const ref=colRef(c)+r,s=style?` s="${style}"`:''; if(typeof val==='number'&&isFinite(val)) return `<c r="${ref}"${s}><v>${val}</v></c>`; const t=esc(val); if(t==='') return `<c r="${ref}"${s}/>`; return `<c r="${ref}"${s} t="inlineStr"><is><t xml:space="preserve">${t}</t></is></c>`; }
function sheetXml(rows){ let body=''; rows.forEach((row,ri)=>{ let cells=''; row.forEach((cl,ci)=>{ const val=(cl&&typeof cl==='object')?cl.v:cl; const st=(cl&&typeof cl==='object')?cl.s:0; cells+=cX(ri+1,ci,val,st); }); body+=`<row r="${ri+1}">${cells}</row>`; });
  return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><cols><col min="1" max="1" width="12"/><col min="2" max="2" width="44"/><col min="3" max="3" width="16"/><col min="4" max="4" width="16"/><col min="5" max="5" width="10"/><col min="6" max="6" width="12"/></cols><sheetData>${body}</sheetData></worksheet>`; }
function buildXlsx(sheetName,rows){

<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/></Types>`;
  const rels=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>`;

  return zipStore([{name:'[Content_Types].xml',bytes:sB(ct)},{name:'_rels/.rels',bytes:sB(rels)},{name:'xl/workbook.xml',bytes:sB(wb)},{name:'xl/_rels/workbook.xml.rels',bytes:sB(wbr)},{name:'xl/styles.xml',bytes:sB(styles)},{name:'xl/worksheets/sheet1.xml',bytes:sB(sheetXml(rows))}]);
}
function fmtFileDate(d){ const p=n=>String(n).padStart(2,'0'); return p(d.getMonth()+1)+'-'+p(d.getDate())+'-'+d.getFullYear(); }

function importBackup(e){ const file=e.target.files[0]; if(!file) return; const r=new FileReader();

/* DAILY SALES + USAGE TARGETS (History tab) */
/* Accepts lines like "2026-10-01, 3250.40" or "10/1/2026 $3,250" — the first number after the date is used. */
function parseSalesText(txt){ const out={}; let bad=0;
  String(txt||'').split(/\r?\n/).forEach(line=>{ if(!line.trim()) return;
    let k=null,m=line.match(/(\d{4})-(\d{1,2})-(\d{1,2})/);
    if(m) k=dateKey(new Date(+m[1],+m[2]-1,+m[3]));
    else if((m=line.match(/(\d{1,2})\/(\d{1,2})\/(\d{2,4})/))){ let y=+m[3]; if(y<100) y+=2000; k=dateKey(new Date(y,+m[1]-1,+m[2])); }
    if(!k){ bad++; return; }
    const nums=(line.replace(m[0],' ').match(/\$?\s?\d[\d,]*(?:\.\d+)?/g)||[]).map(s=>Number(s.replace(/[$,\s]/g,''))).filter(n=>isFinite(n));
    if(!nums.length){ bad++; return; } out[k]=nums[0]; });
  return {out,bad}; }
function salesCardHtml(){

    ${keys.length?`<div class="salesgrid">${keys.slice(0,14).map(k=>`<div class="s"><span>${parseKey(k).toLocaleDateString(undefined,{weekday:'short',month:'numeric',day:'numeric'})}</span><b>${money(salesOn(k))}</b><button data-sdel="${k}" title="Remove this day" aria-label="Remove ${k}">✕</button></div>`).join('')}</div>${keys.length>14?`<div class="hint" style="padding:6px 0 0">Showing the latest 14 of ${keys.length} days.</div>`:''}`:''}

function usageCardHtml(){

    rows.push({v,it,mm,ct}); }));

    <div class="row" style="margin-top:12px"><button class="btn sm ghost" id="applyAllSug">Copy all targets to manual pars</button><span class="hint" style="padding:0">Useful as a starting point if you turn automatic pars off.</span></div></div></div>`; }
function applySug(itemId,val){ const it=findItem(itemId).it; if(!it) return; ORDER_DAYS.forEach(d=>it.pars[d]=val); }

function switchTab(t){ ui.tab=t; document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===t)); ['count','orders','history','setup'].forEach(x=>document.getElementById('tab-'+x).style.display=x===t?'':'none'); if(t==='count') renderCount(); else if(t==='orders') renderOrders(); else if(t==='history') renderHistory(); else renderSetup(); }

/* ============================================================ CLOUD SYNC ENGINE ============================================================
   Layout in Firestore:
     stores/_index                 locations list (+ old-style passcode, only used before the rules are published)
     stores/loc_<id>               one location's setup, counts and daily sales
     stores/loc_<id>/history/<id>  one saved inventory per document (keeps the main record far under the 1 MB cap)
     members/<uid>                 a device that entered the passcode; firestore.rules checks it on every read and write
     settings/passcode             the store passcode; nobody can read it, the rules compare against it
     settings/status               {passcodeSet:true} once a passcode exists (readable, so the gate knows what to ask)
   Setup changes are sent per field, and only the fields that changed, so two people editing
   different things don't overwrite each other. Daily sales are sent one day at a time. */
const CONFIG_KEYS=['vendors','recipientsGlobal','staff','autoPar','coverDays'];
const PASS_KEY='pepperlunch_passok';
let pushTimer=null,resubTimer=null;
function ser(v){ return JSON.stringify(v,(k,x)=>k.charAt(0)==='_'?undefined:x); }
function localVal(k){ return k==='coverDays'?coverDays():k==='autoPar'?!!state.autoPar:k==='recipientsGlobal'?(state.recipientsGlobal||''):k==='staff'?(state.staff||[]):state[k]; }
function isDirty(k){ return SYNC.last[k]!==undefined && ser(localVal(k))!==SYNC.last[k]; }
function schedulePush(){ if(!SYNC.on) return; clearTimeout(pushTimer); pushTimer=setTimeout(pushConfig,600); }
function syncErr(e){ if(e&&e.code==='permission-denied') return lostAccess(); setSyncChip('err'); }
function setSyncChip(s){ const c=document.getElementById('syncChip'),t=document.getElementById('syncTxt'); if(!c) return; c.style.display=syncEnabled()?'':'none'; c.classList.remove('on','err'); if(s==='on'){ c.classList.add('on'); t.textContent=SYNC.secure?'Synced':'Synced (unsecured)'; } else if(s==='err'){ c.classList.add('err'); t.textContent='Sync error'; } else t.textContent='Connecting…'; }
function storeUpdate(patch){ return SYNC.storeRef.update(patch).catch(e=>{ if(e&&e.code==='not-found'){ const o={}; Object.keys(patch).forEach(k=>{ if(!k.includes('.')) o[k]=patch[k]; }); return SYNC.storeRef.set(o,{merge:true}); } throw e; }); }
function pushConfig(){ if(!SYNC.on||!SYNC.storeRef||!SYNC.ready||!SYNC.synced) return;
  const patch={}; let n=0;
  CONFIG_KEYS.forEach(k=>{ const v=localVal(k),sv=ser(v); if(sv!==SYNC.last[k]){ patch[k]=JSON.parse(sv); SYNC.last[k]=sv; n++; } });
  const prev=SYNC.lastSales||{},FV=firebase.firestore.FieldValue;
  const salesPatch=[];
  Object.keys(sales).forEach(k=>{ if(prev[k]!==sales[k]) salesPatch.push([k,sales[k]]); });
  Object.keys(prev).forEach(k=>{ if(!(k in sales)) salesPatch.push([k,FV.delete()]); });
  SYNC.lastSales=Object.assign({},sales);
  if(n) storeUpdate(patch).catch(syncErr);
  if(salesPatch.length){ const args=[]; salesPatch.forEach(([k,v])=>args.push(new firebase.firestore.FieldPath('sales',k),v));
    SYNC.storeRef.update.apply(SYNC.storeRef,args).catch(e=>{ if(e&&e.code==='not-found') SYNC.storeRef.set({sales},{merge:true}).catch(syncErr); else syncErr(e); }); }
  const locs=ser(state.locations); if(SYNC.indexRef&&locs!==SYNC.last.locations){ SYNC.last.locations=locs; SYNC.indexRef.set({locations:state.locations},{merge:true}).catch(syncErr); } }
function pushCountsAll(){ if(!SYNC.on||!SYNC.storeRef) return; storeUpdate({counts:counts}).catch(syncErr); }
function pushCount(id){ if(!SYNC.on||!SYNC.storeRef) return; const o={}; o['counts.'+id]=cell(id); SYNC.storeRef.update(o).catch(e=>{ if(e&&e.code==='not-found') SYNC.storeRef.set({counts:{[id]:cell(id)}},{merge:true}).catch(syncErr); else syncErr(e); }); }
function pushCountsClear(){ if(!SYNC.on||!SYNC.storeRef) return; storeUpdate({counts:{}}).catch(syncErr); }
function snapData(s){ const o=Object.assign({},s); delete o.id; return o; }
function pushSnapshot(s){ if(!SYNC.on||!SYNC.histRef) return; SYNC.histRef.doc(snapId(s).id).set(snapData(s)).catch(syncErr); }
function deleteSnapshot(s){ if(!SYNC.on||!SYNC.histRef||!s||!s.id) return; SYNC.histRef.doc(s.id).delete().catch(syncErr); }
function pushHistoryAll(){ if(!SYNC.on||!SYNC.histRef) return; const b=SYNC.db.batch(); history.slice(0,200).forEach(s=>b.set(SYNC.histRef.doc(snapId(s).id),snapData(s))); b.commit().catch(syncErr); }
/* One-time move: older versions kept every saved inventory inside the location record. */
function migrateHistoryArray(arr){ if(SYNC.migrating) return; SYNC.migrating=true;
  const b=SYNC.db.batch(); arr.slice(0,200).forEach(s=>{ if(s&&s.ts) b.set(SYNC.histRef.doc(snapId(s).id),snapData(s)); });
  b.update(SYNC.storeRef,{history:firebase.firestore.FieldValue.delete()});
  b.commit().then(()=>{ SYNC.migrating=false; }).catch(e=>{ SYNC.migrating=false; syncErr(e); }); }
function isTypingIn(tabId){ const a=document.activeElement; const host=document.getElementById(tabId); return a&&host&&host.contains(a)&&/^(INPUT|SELECT|TEXTAREA)$/.test(a.tagName); }
function refreshTab(own){ if(document.getElementById('appScreen').style.display==='none') return;
  // Count tab refreshes totals in place so a live update never clears the boxes someone is typing into.
  if(ui.tab==='count'){ try{ refreshAllTotals(); }catch(e){ renderCount(); } }
  else if(ui.tab==='orders') renderOrders();
  else if(ui.tab==='history'){ if(!isTypingIn('tab-history')) renderHistory(); }
  else if(ui.tab==='setup'){ if(!(own||isTypingIn('tab-setup'))) renderSetup(); } }
function applyRemoteStore(data, own){ if(!data) return; SYNC.applying=true;
  const collapsed={}; (state.vendors||[]).forEach(v=>{ if(v._collapsed) collapsed[v.id]=true; });
  // A field this device changed but hasn't sent yet keeps the local value; everything else takes the cloud copy.
  if(Array.isArray(data.vendors)&&!isDirty('vendors')){ state.vendors=data.vendors; state.vendors.forEach(v=>{ if(collapsed[v.id]) v._collapsed=true; }); SYNC.last.vendors=ser(state.vendors); }
  if(typeof data.recipientsGlobal==='string'&&!isDirty('recipientsGlobal')){ state.recipientsGlobal=data.recipientsGlobal; SYNC.last.recipientsGlobal=ser(data.recipientsGlobal); }
  if(Array.isArray(data.staff)&&data.staff.length&&!isDirty('staff')){ state.staff=data.staff; SYNC.last.staff=ser(data.staff); }
  if(typeof data.autoPar==='boolean'&&!isDirty('autoPar')){ state.autoPar=data.autoPar; SYNC.last.autoPar=ser(data.autoPar); }
  if(Number(data.coverDays)>0&&!isDirty('coverDays')){ state.coverDays=Number(data.coverDays); SYNC.last.coverDays=ser(state.coverDays); }
  if(data.counts&&typeof data.counts==='object') counts=data.counts;
  if(data.sales&&typeof data.sales==='object'){ const pending=SYNC.lastSales&&ser(SYNC.lastSales)!==ser(sales); if(!pending){ sales=data.sales; SYNC.lastSales=Object.assign({},sales); } }
  if(Array.isArray(data.history)&&data.history.length){ if(!history.length) history=data.history.slice(); migrateHistoryArray(data.history); }
  migrate(); persistLocal(); SYNC.applying=false; refreshTab(own); }
function applyRemoteHistory(qs){ SYNC.applying=true;
  const remote=qs.docs.map(d=>Object.assign({id:d.id},d.data()));
  if(remote.length||!SYNC.migrating) history=remote;
  invalidateModel(); persistLocal(); SYNC.applying=false; refreshTab(qs.metadata.hasPendingWrites); }
function applyRemoteIndex(data){ if(!data) return;
  if(Array.isArray(data.locations)&&data.locations.length&&ser(data.locations)!==ser(state.locations)){ state.locations=data.locations; SYNC.last.locations=ser(data.locations);
    if(!state.locations.some(l=>l.id===state.locationId)){ switchLocation(state.locations[0].id); } persistLocal(); }
  SYNC.passcode=(!SYNC.secure&&data.passcode!=null)?String(data.passcode):''; }
function refreshAllTotals(){ const host=document.getElementById('tab-count'); if(!host) return; let ok=true;
  state.vendors.forEach(v=>v.items.forEach(it=>{ const h=host.querySelector('[data-have="'+it.id+'"]'); if(!h){ ok=false; return; } h.textContent=haveText(it);
    const oc=host.querySelector('[data-order="'+it.id+'"]'); if(oc){ const q=orderQty(it,ui.day); oc.querySelector('b').textContent=q; oc.classList.toggle('zero',q<=0); oc.closest('tr').classList.toggle('toorder',q>0); } }));
  if(!ok){ renderCount(); return; }
  state.vendors.forEach(v=>{ const m=host.querySelector('[data-meta="'+v.id+'"]'); if(m){ const n=toOrderCount(v,ui.day); m.innerHTML=`${v.items.length} items${n?' · <b style="color:var(--red)">'+n+' to order</b>':''}`; } }); }
function locDocId(){ return 'loc_'+(state.locationId||'default'); }
function scheduleResub(){ if(!SYNC.on) return; clearTimeout(resubTimer); resubTimer=setTimeout(()=>{ if(SYNC.on&&SYNC.ready) subscribeLocation(); }, 4000); }
function unsubscribeAll(){ SYNC.unsub.forEach(u=>{try{u();}catch(e){}}); SYNC.unsub=[]; }
function subscribeLocation(){ if(!SYNC.on) return; unsubscribeAll();
  const onErr=e=>{ if(e&&e.code==='permission-denied') lostAccess(); else { setSyncChip('err'); scheduleResub(); } };
  SYNC.unsub.push(SYNC.indexRef.onSnapshot(s=>{ if(s.exists) applyRemoteIndex(s.data()); },onErr));
  SYNC.storeRef=SYNC.db.collection('stores').doc(locDocId()); SYNC.histRef=SYNC.storeRef.collection('history');
  SYNC.last={locations:SYNC.last.locations}; SYNC.lastSales=null; SYNC.synced=false; let first=true;
  SYNC.unsub.push(SYNC.storeRef.onSnapshot(snap=>{ setSyncChip('on');
    if(snap.exists) applyRemoteStore(snap.data(), snap.metadata.hasPendingWrites);
    if(first&&!snap.metadata.fromCache){ first=false; SYNC.synced=true; if(!SYNC.lastSales) SYNC.lastSales={};
      if(!snap.exists){ pushConfig(); pushHistoryAll(); } else pushConfig(); } },onErr));
  SYNC.unsub.push(SYNC.histRef.orderBy('ts','desc').limit(200).onSnapshot(applyRemoteHistory,onErr)); }

/* ---------- access: anonymous sign-in + passcode the database checks ---------- */
function initSync(){ if(!syncEnabled()) return false;
  try{ firebase.initializeApp(FIREBASE_CONFIG); SYNC.db=firebase.firestore(); SYNC.db.enablePersistence({synchronizeTabs:true}).catch(()=>{});
    SYNC.on=true; SYNC.indexRef=SYNC.db.collection('stores').doc('_index'); setSyncChip('connecting'); return true;
  }catch(e){ SYNC.on=false; return false; } }
function signIn(){ if(!firebase.auth) return Promise.resolve(null);
  const a=firebase.auth();
  return new Promise(res=>{ const off=a.onAuthStateChanged(u=>{ off(); if(u) return res(u.uid);
    a.signInAnonymously().then(c=>res(c.user.uid)).catch(()=>res(null)); }); }); }
function memberRef(){ return SYNC.db.collection('members').doc(SYNC.uid); }
/* Can this device read the store data right now? 'yes', 'no' (rules refused), or 'offline'. */
function probe(){ return SYNC.indexRef.get().then(s=>{ if(s.exists) applyRemoteIndex(s.data()); return 'yes'; })
  .catch(e=>e&&e.code==='permission-denied'?'no':'offline'); }
async function connect(){
  SYNC.uid=await signIn();
  if(SYNC.uid){ try{ const m=await memberRef().get(); SYNC.secure=m.exists; }catch(e){ SYNC.secure=false; } }
  const p=await probe();
  if(p==='no') return showGate();
  if(!SYNC.secure&&legacyGate()) return showGate();
  startSession(); }
function startSession(){ SYNC.ready=true; subscribeLocation(); setSyncChip('connecting');
  document.getElementById('gateScreen').style.display='none';
  if(document.getElementById('appScreen').style.display==='none') showStart(); else if(ui.tab==='setup') renderSetup(); }
function lostAccess(){ if(!SYNC.ready) return; SYNC.ready=false; SYNC.secure=false; unsubscribeAll(); setSyncChip('err');
  flash('The store passcode changed. Enter the new one.'); showGate(); }
function legacyGate(){ if(!SYNC.passcode) return false; let ok=null; try{ ok=localStorage.getItem(PASS_KEY); }catch(e){} return ok!==SYNC.passcode; }
async function showGate(){ document.getElementById('gateScreen').style.display=''; document.getElementById('startScreen').style.display='none'; document.getElementById('appScreen').style.display='none';
  const inp=document.getElementById('gateInput'),msg=document.querySelector('#gateScreen .gate p'),btn=document.getElementById('gateBtn');
  inp.value=''; document.getElementById('gateErr').textContent=''; SYNC.creating=false;
  msg.textContent='Enter the store passcode to access the shared inventory.'; btn.textContent='Unlock';
  if(SYNC.uid){ try{ const st=await SYNC.db.collection('settings').doc('status').get();
    if(!st.exists){ SYNC.creating=true; msg.textContent='First-time setup: choose a store passcode (6 or more digits). Staff will enter it once on each phone.'; btn.textContent='Set passcode'; } }catch(e){} }
  setTimeout(()=>inp.focus(),120); }
async function joinWith(code){ try{ await memberRef().set({code,name:state.userName||'',at:firebase.firestore.FieldValue.serverTimestamp()}); }catch(e){ return false; }
  SYNC.secure=true; return (await probe())!=='no'; }
async function createPasscode(code){ const b=SYNC.db.batch(),st=SYNC.db.collection('settings');
  b.set(st.doc('passcode'),{code}); b.set(st.doc('status'),{passcodeSet:true});
  try{ await b.commit(); return true; }catch(e){ return false; } }
async function tryUnlock(){ const inp=document.getElementById('gateInput'),err=document.getElementById('gateErr'),btn=document.getElementById('gateBtn');
  const code=String(inp.value).trim(); if(!code) return;
  if(SYNC.creating&&!/^\d{6,}$/.test(code)){ err.textContent='Use 6 or more digits'; return; }
  btn.disabled=true; err.textContent='Checking…';
  let ok=false;
  if(SYNC.uid){ if(SYNC.creating) ok=(await createPasscode(code))&&(await joinWith(code)); else ok=await joinWith(code); }
  if(!ok&&!SYNC.secure&&SYNC.passcode&&code===SYNC.passcode){ try{ localStorage.setItem(PASS_KEY,code); }catch(e){} ok=true; }
  btn.disabled=false;
  if(ok){ err.textContent=''; if(SYNC.creating) flash('Store passcode set'); startSession(); }
  else { SYNC.secure=false; err.textContent=SYNC.creating?'Could not set the passcode. Check your connection.':'Incorrect passcode'; inp.value=''; inp.focus(); } }
async function changePasscode(code){ if(!/^\d{6,}$/.test(code)){ flash('Use 6 or more digits'); return; }
  try{ await SYNC.db.collection('settings').doc('passcode').set({code}); await memberRef().set({code,name:state.userName||'',at:firebase.firestore.FieldValue.serverTimestamp()});
    flash('Passcode changed. Other phones will ask for it.'); renderSetup(); }
  catch(e){ flash('Could not change the passcode ('+(e.code||'error')+')'); } }

/* ---------- boot ---------- */
load(); startClock();
if(initSync()){ connect(); setTimeout(()=>{ if(!SYNC.ready&&document.getElementById('gateScreen').style.display==='none'&&document.getElementById('appScreen').style.display==='none') showStart(); }, 6000); }
else showStart();
document.getElementById('goSetup').addEventListener('click',()=>{ if(!ui.day) ui.day=ORDER_DAYS[0]; enterApp(ui.day); switchTab('setup'); });
document.getElementById('daychip').addEventListener('click',showStart);
document.getElementById('locLabel').addEventListener('click',showStart);
document.getElementById('gateBtn').addEventListener('click',tryUnlock);
document.getElementById('gateInput').addEventListener('keydown',e=>{ if(e.key==='Enter') tryUnlock(); });
document.querySelectorAll('nav button').forEach(b=>b.addEventListener('click',()=>switchTab(b.dataset.tab)));
</script>
